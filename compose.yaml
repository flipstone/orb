services:
  dev:
    image: ghcr.io/flipstone/haskell-tools:debian-ghc-9.10.3-build-2026.10.21.67@sha256:d1e44470d87c65de63239c10ccde33e6254e8cf9ce4ec54071461c34cb30b450
    volumes:
      - .:${PROJECT_DIR}
      - flipstone_stack_root:/stack-root
      - ${GIT_COMMON_DIR:-.gitignore}:${GIT_COMMON_DIR:-/tmp/no-git-common-dir}
    working_dir: ${PROJECT_DIR}
    environment:
      STACK_ROOT: /stack-root
      IN_DEV_CONTAINER: "true"
      # Pass through CI variable from GitHub (or set it to `true` locally)
      # for debugging CI builds
      CI:

volumes:
  flipstone_stack_root:
    external: true
